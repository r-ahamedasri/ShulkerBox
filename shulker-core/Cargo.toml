[package]
name = "shulker-core"
version = "0.1.0"
edition = "2021"
description = "Shulker Box: core library for a zero-knowledge, local-first encrypted vault"
license = "MIT"

[lib]
name = "shulker_core"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"
rand_core = { version = "0.6", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
bip39 = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
